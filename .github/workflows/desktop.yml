# Builds CloudeIDE as a desktop application and attaches it to a release.
#
# Linux first, on its own: the desktop build had never been run here, and the
# Electron download it needs is blocked from the machine this was written on,
# so the first honest test of it was this workflow. Linux now builds, starts
# and photographs, which is why Windows joins it — one unknown at a time was
# the point, and Linux is no longer one.
name: Desktop app

# A workflow that only offers a manual run, and lives outside the default
# branch, cannot be started at all: GitHub registers it when it first runs
# from an event. Pushing a change to this file is exactly when it wants
# testing, so that is the event — and the path filter keeps every other push
# from starting an hour-long build.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: false
  push:
    branches: [cloudeide-branding]
    paths:
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The runner ships toolchains this build never touches, and it needs the
      # room they occupy: the desktop package carries an entire Electron.
      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      # The same packages upstream's own workflow installs; npm ci builds
      # native modules that need these headers.
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      # npm ci, and again if the network drops it.
      #
      # The macOS job died here at 2m41s with a TLS socket error inside npm's
      # own HTTP parsing — a download cut off mid-stream, not a package that
      # will not install. This build pulls a few hundred megabytes including
      # Electron, so one lost connection is enough to lose twenty minutes.
      #
      # npm's own --fetch-retries covers a single request giving up; it does
      # not cover the install dying partway through, which is what happened.
      # So the whole command is retried, three times, with a pause between.
      - name: Install dependencies
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "--- npm ci, attempt ${attempt} ---"
            if npm ci --fetch-retries 5 --fetch-retry-maxtimeout 120000; then
              exit 0
            fi
            echo "::warning::npm ci failed on attempt ${attempt}"
            sleep $(( attempt * 20 ))
          done
          echo "::error::npm ci failed three times"
          exit 1

      # Not the minified build: its mangling step fails on upstream source this
      # fork has not touched, which is the same wall the web build hit. The
      # unminified one is larger and is a working application.
      - name: Build
        run: |
          npm run gulp compile-build-without-mangling
          npm run gulp vscode-linux-x64
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          # The build downloads the js-debug extensions from the GitHub API,
          # which rate limits unauthenticated callers by runner IP — shared,
          # so the budget can already be gone on arrival. That is what stopped
          # the first Windows build to get this far: ten retries, every one a
          # 403. build/lib/fetch.ts sends this token when it is set.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Package
        id: package
        run: |
          set -euo pipefail
          test -d ../VSCode-linux-x64 || { echo "::error::the build produced no VSCode-linux-x64"; exit 1; }
          # Named for the product rather than the folder the build writes.
          version="$(node -p "require('./package.json').version")"
          name="CloudeIDE-linux-x64-${version}"
          tar -czf "${name}.tar.gz" -C .. VSCode-linux-x64
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -lh "${name}.tar.gz"
          echo "--- what is in it ---"
          ls ../VSCode-linux-x64 | head -20
          echo "--- the binary ---"
          file ../VSCode-linux-x64/cloudeide || true

      # A tarball cannot answer cloudeide:// — on Linux a URL scheme is claimed
      # by an installed .desktop file, and only a package installs one. Sign-in
      # hands this app its code through exactly that URL, so here the .deb is
      # not a nicety for tidy people; it is the difference between the browser
      # round trip completing and dead-ending in a browser tab. Windows needs
      # no equivalent: Electron claims the scheme at runtime there.
      - name: Build the .deb
        run: |
          set -euxo pipefail
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb
          deb="$(find .build/linux/deb -name '*.deb' | head -1)"
          test -n "$deb" || { echo "::error::no .deb was produced"; exit 1; }
          cp "$deb" CloudeIDE-linux-x64.deb
          ls -lh CloudeIDE-linux-x64.deb
          # Proof the package claims the scheme, rather than a hope that it does.
          dpkg-deb -c CloudeIDE-linux-x64.deb | grep -F 'url-handler.desktop'
          # And proof it does not carry Microsoft's apt repository with it. This
          # package is not served from there and uninstalling it must not remove
          # a key a real VS Code install depends on, so the scripts must not
          # mention either — a grep is the only way to know the guard held.
          dpkg-deb --control CloudeIDE-linux-x64.deb /tmp/deb-control
          if grep -rl 'packages.microsoft.com\|microsoft.gpg\|add-microsoft-repo' /tmp/deb-control; then
            echo "::error::the package still touches Microsoft's apt repository"
            exit 1
          fi
          echo "no Microsoft repository in the maintainer scripts"
        env:
          NODE_OPTIONS: --max-old-space-size=12288

      # Neither of us has a Linux desktop to open this on, and "it built" is
      # not "it runs". The runner is a Linux machine, so the application is
      # started here, on a virtual screen, and photographed. That is the only
      # evidence available that the thing actually opens.
      #
      # Everything that touches the application or the screen now carries its
      # own `timeout`, and the shell traces what it runs. An earlier run sat in
      # this step for forty minutes against seventy-eight seconds of intended
      # waiting, and with no per-command limit and no trace the log could not
      # say which command was stuck. The `--version` probe that run introduced
      # is gone: a window on screen proves more than it did.
      - name: Start it and take a picture
        id: smoke
        timeout-minutes: 15
        run: |
          set -uxo pipefail
          sudo apt-get install -y xvfb imagemagick x11-utils xdotool
          cd ../VSCode-linux-x64

          # A project, not a one-line file. This photograph is on the landing
          # page, and the page's claim is that the agent reads the project you
          # have open — which a screenshot of an empty tree cannot support.
          # Same script the recording uses, so the still and the film are of
          # the same folder.
          "$GITHUB_WORKSPACE/build/cloudeide/sample-project.sh" /tmp/ws

          # The screen comes first, and the app waits for it to answer rather
          # than for a fixed number of seconds.
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 >/dev/null 2>&1 &
          timeout 30 bash -c 'until xdpyinfo -display :99 >/dev/null 2>&1; do sleep 1; done' \
            || echo "::warning::the virtual screen never answered"

          # --no-sandbox because the chrome sandbox wants privileges a runner
          # does not grant; the rest keeps a headless machine from stalling.
          # A first run opens the walkthrough over two thirds of the window,
          # and what it offers there is Copilot — which is not this product
          # and has no business in a picture of it. The file is named so the
          # editor has something in it besides a background.
          ./cloudeide /tmp/ws /tmp/ws/src/menu.js \
            --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --skip-welcome --skip-release-notes --disable-workspace-trust \
            --user-data-dir /tmp/cloudeide-data --extensions-dir /tmp/cloudeide-ext \
            > /tmp/app.log 2>&1 &
          app=$!

          # Long enough for a first run: it unpacks, starts an extension host
          # and paints a window.
          sleep 75

          if ! kill -0 "$app" 2>/dev/null; then
            echo "::error::the application exited before it could be photographed"
            tail -40 /tmp/app.log || true
            exit 1
          fi

          timeout 30 xdotool search --name "." getwindowname %@ 2>/dev/null | head -10 || true
          timeout 60 import -window root /tmp/desktop.png \
            || echo "::warning::the screen could not be photographed"
          identify /tmp/desktop.png || true
          kill "$app" 2>/dev/null || true
          echo "--- the application's own output ---"
          tail -25 /tmp/app.log || true

          # The picture itself, through the log.
          #
          # The artifact is the real copy, but it is served from a host this
          # session cannot reach, so the only way to actually look at the
          # screen is to carry it in the one channel that does come back: a
          # small JPEG, base64, in fixed-width lines.
          timeout 60 convert /tmp/desktop.png -resize 900x -quality 52 /tmp/desktop.jpg || true
          if [ -s /tmp/desktop.jpg ]; then
            ls -l /tmp/desktop.jpg
            echo "--- BEGIN SCREENSHOT BASE64 ---"
            base64 -w 500 /tmp/desktop.jpg
            echo "--- END SCREENSHOT BASE64 ---"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudeide-linux-screenshot
          path: |
            /tmp/desktop.png
            /tmp/app.log
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: cloudeide-linux-x64
          path: ${{ steps.package.outputs.name }}.tar.gz
          retention-days: 14

      # One release per version, both platforms inside it.
      #
      # Two releases — one tagged -linux, one -windows — would break the very
      # thing a release is for here: /releases/latest resolves to exactly one
      # of them, so the landing page's other download link would 404. Both
      # jobs therefore write to the same tag, whichever gets there first
      # creating it.
      #
      # The asset names carry no version. The landing page links
      # /releases/latest/download/CloudeIDE-linux-x64.tar.gz, which only keeps
      # working if the name is the same in every release; the version is in
      # the release title instead.
      - name: Publish a release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.package.outputs.version }}"
          asset="CloudeIDE-linux-x64.tar.gz"
          cp "${{ steps.package.outputs.name }}.tar.gz" "$asset"
          gh release create "$tag" \
            --title "CloudeIDE ${{ steps.package.outputs.version }}" \
            --notes "Linux: install the .deb (sudo apt install ./CloudeIDE-linux-x64.deb) so browser sign-in can return to the app; the .tar.gz runs without installing. Windows: unzip and run CloudeIDE.exe. macOS (Apple Silicon): unzip, move CloudeIDE.app to Applications, then right-click it and choose Open the first time. The build is not notarized, so a double-click is refused once. Same thing from a terminal: xattr -dr com.apple.quarantine /Applications/CloudeIDE.app" \
            || echo "release $tag already exists"
          gh release upload "$tag" "$asset" CloudeIDE-linux-x64.deb --clobber

  # Windows, once Linux was known to build. Same two gulp tasks with the other
  # platform's name; what differs is the packaging (a zip, because Windows has
  # no tar in its shell by default) and the smoke test, which has no Xvfb to
  # lean on — the runner's own session is the screen.
  windows:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # npm ci died here with "*** Invalid C/C++ Compiler Toolchain".
      # build/npm/preinstall.ts looks for Visual Studio under
      # %ProgramFiles%/Microsoft Visual Studio/<year>/<edition>, trying a fixed
      # list of editions, and found nothing it recognised on this image. It
      # also honours a vs<year>_install environment variable, so rather than
      # hard-code an edition and a year that move with the runner image, ask
      # the Visual Studio installer's own locator where the C++ toolchain is
      # and hand preinstall.ts that answer.
      - name: Find Visual Studio
        shell: pwsh
        run: |
          Write-Output "--- what this runner actually has ---"
          Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ChildItem $_.FullName -ErrorAction SilentlyContinue } |
            Select-Object -ExpandProperty FullName

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Output "::error::vswhere.exe is not at $vswhere, so Visual Studio cannot be located"
            exit 1
          }

          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            Write-Output "::error::no Visual Studio with the C++ toolchain is installed on this runner"
            exit 1
          }

          # preinstall.ts only knows the names vs2022_install and
          # vs2019_install. Whatever year the located install belongs to, this
          # is the path it should use, and node-gyp locates the toolchain
          # through vswhere itself.
          Write-Output "Visual Studio: $installPath"
          "vs2022_install=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      # npm ci, and again if the network drops it.
      #
      # The macOS job died here at 2m41s with a TLS socket error inside npm's
      # own HTTP parsing — a download cut off mid-stream, not a package that
      # will not install. This build pulls a few hundred megabytes including
      # Electron, so one lost connection is enough to lose twenty minutes.
      #
      # npm's own --fetch-retries covers a single request giving up; it does
      # not cover the install dying partway through, which is what happened.
      # So the whole command is retried, three times, with a pause between.
      - name: Install dependencies
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "--- npm ci, attempt ${attempt} ---"
            if npm ci --fetch-retries 5 --fetch-retry-maxtimeout 120000; then
              exit 0
            fi
            echo "::warning::npm ci failed on attempt ${attempt}"
            sleep $(( attempt * 20 ))
          done
          echo "::error::npm ci failed three times"
          exit 1
        env:
          npm_config_arch: x64

      - name: Build
        run: |
          npm run gulp compile-build-without-mangling
          npm run gulp vscode-win32-x64
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          # The build downloads the js-debug extensions from the GitHub API,
          # which rate limits unauthenticated callers by runner IP — shared,
          # so the budget can already be gone on arrival. That is what stopped
          # the first Windows build to get this far: ten retries, every one a
          # 403. build/lib/fetch.ts sends this token when it is set.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $built = Join-Path (Split-Path $PWD -Parent) 'VSCode-win32-x64'
          if (-not (Test-Path $built)) {
            Write-Output "::error::the build produced no VSCode-win32-x64"
            exit 1
          }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $name = "CloudeIDE-win32-x64-$version"
          # 7z ships on the runner and is an order of magnitude faster than
          # Compress-Archive on a folder this size.
          7z a -tzip -mx=5 "$name.zip" "$built" | Select-Object -Last 5
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Item "$name.zip" | Select-Object Name, Length
          Write-Output "--- what is in it ---"
          Get-ChildItem $built | Select-Object -First 20 -ExpandProperty Name
          Write-Output "--- the binary ---"
          Get-Item (Join-Path $built 'CloudeIDE.exe') | Select-Object Name, Length

      # No virtual screen here: the runner has a session of its own, so the
      # application is started into it and the desktop is copied off with the
      # same drawing calls a screenshot key would use. None of this is allowed
      # to fail the job — the package is the deliverable, the picture is
      # evidence about it.
      # The project both platforms are photographed with, written by the one
      # script. Git Bash is on this runner and maps /c/ws to C:\ws.
      - name: Write the project
        shell: bash
        run: bash build/cloudeide/sample-project.sh /c/ws

      - name: Start it and take a picture
        id: smoke
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $built = Join-Path (Split-Path $PWD -Parent) 'VSCode-win32-x64'
          $exe = Join-Path $built 'CloudeIDE.exe'

          # Same flags as Linux, and for the same reason: a first run puts the
          # walkthrough over two thirds of the window and offers Copilot in it.
          $app = Start-Process -FilePath $exe -PassThru -ArgumentList @(
            'C:\ws',
            'C:\ws\src\menu.js',
            '--disable-gpu',
            '--skip-welcome', '--skip-release-notes', '--disable-workspace-trust',
            '--user-data-dir', 'C:\cloudeide-data',
            '--extensions-dir', 'C:\cloudeide-ext'
          )
          Start-Sleep -Seconds 75

          if ($app.HasExited) {
            Write-Output "::error::the application exited before it could be photographed (code $($app.ExitCode))"
            exit 1
          }
          Write-Output "the application is still running; main window title: $((Get-Process -Id $app.Id).MainWindowTitle)"

          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($screen.X, $screen.Y, 0, 0, $bitmap.Size)
            $shot = Join-Path $env:RUNNER_TEMP 'desktop.png'
            $bitmap.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Output "wrote $shot at $($screen.Width)x$($screen.Height)"
          } catch {
            Write-Output "::warning::the screen could not be photographed: $_"
          }

          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue

          # Same trick as on Linux: the artifact host is unreachable from the
          # session that reads these logs, so a small copy rides back in the
          # log itself.
          $shot = Join-Path $env:RUNNER_TEMP 'desktop.png'
          if (Test-Path $shot) {
            # Resized with the same drawing library that took it, rather than
            # an image tool the runner may or may not carry.
            $full = [System.Drawing.Image]::FromFile($shot)
            $small = New-Object System.Drawing.Bitmap 900, ([int](900 * $full.Height / $full.Width))
            $g = [System.Drawing.Graphics]::FromImage($small)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($full, 0, 0, $small.Width, $small.Height)
            $jpg = Join-Path $env:RUNNER_TEMP 'desktop.jpg'
            $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() |
              Where-Object { $_.MimeType -eq 'image/jpeg' }
            $params = New-Object System.Drawing.Imaging.EncoderParameters 1
            $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter(
              [System.Drawing.Imaging.Encoder]::Quality, 52)
            $small.Save($jpg, $codec, $params)
            $full.Dispose()
            Get-Item $jpg | Select-Object Name, Length
            Write-Output "--- BEGIN SCREENSHOT BASE64 ---"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes($jpg)) -split '(.{500})' |
              Where-Object { $_ } | ForEach-Object { Write-Output $_ }
            Write-Output "--- END SCREENSHOT BASE64 ---"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudeide-windows-screenshot
          path: ${{ runner.temp }}/desktop.png
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: cloudeide-win32-x64
          path: ${{ steps.package.outputs.name }}.zip
          retention-days: 14

      - name: Publish a release
        if: github.event_name == 'push' || inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.package.outputs.version }}"
          asset="CloudeIDE-win32-x64.zip"
          cp "${{ steps.package.outputs.name }}.zip" "$asset"
          gh release create "$tag" \
            --title "CloudeIDE ${{ steps.package.outputs.version }}" \
            --notes "Linux: install the .deb (sudo apt install ./CloudeIDE-linux-x64.deb) so browser sign-in can return to the app; the .tar.gz runs without installing. Windows: unzip and run CloudeIDE.exe. macOS (Apple Silicon): unzip, move CloudeIDE.app to Applications, then right-click it and choose Open the first time. The build is not notarized, so a double-click is refused once. Same thing from a terminal: xattr -dr com.apple.quarantine /Applications/CloudeIDE.app" \
            || echo "release $tag already exists"
          gh release upload "$tag" "$asset" --clobber

  # macOS, and Apple Silicon only to begin with.
  #
  # One unknown at a time is how Linux and then Windows got here, and this is
  # the third. Every MacBook sold since late 2020 is Apple Silicon, so arm64 is
  # the one that matters; darwin-x64 is a `vscode-darwin-x64` away once this is
  # known to work, and is only worth adding for an older Intel machine.
  #
  # Nothing here is signed with an Apple certificate, and none is needed. The
  # $99-a-year Developer Program buys notarization — the absence of the "cannot
  # be opened because Apple cannot check it for malicious software" dialog. It
  # does not buy the ability to run. That is what the ad-hoc signature in the
  # packaging step is for, and that is free.
  macos:
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: What this runner has
        run: |
          uname -m
          df -h /
          xcodebuild -version || true

      # npm ci, and again if the network drops it.
      #
      # The macOS job died here at 2m41s with a TLS socket error inside npm's
      # own HTTP parsing — a download cut off mid-stream, not a package that
      # will not install. This build pulls a few hundred megabytes including
      # Electron, so one lost connection is enough to lose twenty minutes.
      #
      # npm's own --fetch-retries covers a single request giving up; it does
      # not cover the install dying partway through, which is what happened.
      # So the whole command is retried, three times, with a pause between.
      - name: Install dependencies
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "--- npm ci, attempt ${attempt} ---"
            if npm ci --fetch-retries 5 --fetch-retry-maxtimeout 120000; then
              exit 0
            fi
            echo "::warning::npm ci failed on attempt ${attempt}"
            sleep $(( attempt * 20 ))
          done
          echo "::error::npm ci failed three times"
          exit 1
        env:
          npm_config_arch: arm64

      - name: Build
        run: |
          npm run gulp compile-build-without-mangling
          npm run gulp vscode-darwin-arm64
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          # The build downloads the js-debug extensions from the GitHub API,
          # which rate limits unauthenticated callers by runner IP — shared, so
          # the budget can already be gone on arrival. build/lib/fetch.ts sends
          # this token when it is set.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Package
        id: package
        run: |
          set -euo pipefail
          built="../VSCode-darwin-arm64"
          app="${built}/CloudeIDE.app"
          test -d "$app" || { echo "::error::the build produced no CloudeIDE.app"; ls -la "$built" 2>/dev/null; exit 1; }

          # An ad-hoc signature, because on Apple Silicon an arm64 binary that
          # carries no valid signature at all is killed by the kernel before it
          # runs — the user sees "CloudeIDE is damaged and can't be opened",
          # which is neither true nor fixable by them. Electron ships ad-hoc
          # signed, and packaging breaks that signature by rewriting Info.plist
          # and moving resources in, so it has to be reapplied afterwards. This
          # needs no Apple account and no certificate: `--sign -` is the ad-hoc
          # identity. It does not stop Gatekeeper asking about an unidentified
          # developer; it is what makes the app launchable at all.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app" && echo "ad-hoc signature verifies"

          version="$(node -p "require('./package.json').version")"
          name="CloudeIDE-darwin-arm64-${version}"

          # ditto, not zip. An .app bundle is full of symlinks — every Electron
          # framework is a tree of them — and plain zip follows them, producing
          # an archive several times the size that unpacks into an application
          # whose signature no longer verifies.
          ditto -c -k --sequesterRsrc --keepParent "$app" "${name}.zip"

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -lh "${name}.zip"
          echo "--- what is in the bundle ---"
          ls "${app}/Contents"
          echo "--- the executable ---"
          ls -l "${app}/Contents/MacOS"

      - name: Write the project
        run: build/cloudeide/sample-project.sh /tmp/ws

      # Started and photographed, as on the other two platforms. The runner has
      # a window server of its own, so there is no Xvfb here — but a macOS
      # runner is the least reliable of the three at drawing anything, so none
      # of this is allowed to fail the job. The package is the deliverable; the
      # picture is evidence about it.
      - name: Start it and take a picture
        id: smoke
        timeout-minutes: 15
        run: |
          set -uxo pipefail
          app="../VSCode-darwin-arm64/CloudeIDE.app"
          bin="${app}/Contents/MacOS/$(ls "${app}/Contents/MacOS" | head -1)"
          test -x "$bin" || { echo "::error::no executable inside the bundle"; exit 1; }

          # The quarantine attribute is applied to downloads, not to a build
          # made here — but stripping it costs nothing and makes this step the
          # same shape as what a person does after downloading.
          xattr -dr com.apple.quarantine "$app" 2>/dev/null || true

          "$bin" /tmp/ws /tmp/ws/src/menu.js \
            --skip-welcome --skip-release-notes --disable-workspace-trust \
            --user-data-dir /tmp/cloudeide-data --extensions-dir /tmp/cloudeide-ext \
            > /tmp/app.log 2>&1 &
          pid=$!

          # Long enough for a first run: it unpacks, starts an extension host
          # and paints a window.
          sleep 75

          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the application exited before it could be photographed"
            tail -40 /tmp/app.log || true
            exit 1
          fi

          screencapture -x /tmp/desktop.png || echo "::warning::the screen could not be photographed"
          ls -l /tmp/desktop.png || true
          kill "$pid" 2>/dev/null || true
          echo "--- the application's own output ---"
          tail -25 /tmp/app.log || true

          # The picture itself, through the log — the artifact store is served
          # from a host the session that reviews these cannot reach.
          if [ -s /tmp/desktop.png ]; then
            sips -Z 900 -s format jpeg -s formatOptions 52 /tmp/desktop.png --out /tmp/desktop.jpg >/dev/null 2>&1 || true
          fi
          if [ -s /tmp/desktop.jpg ]; then
            ls -l /tmp/desktop.jpg
            echo "--- BEGIN SCREENSHOT BASE64 ---"
            base64 -b 500 -i /tmp/desktop.jpg
            echo "--- END SCREENSHOT BASE64 ---"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudeide-macos-screenshot
          path: |
            /tmp/desktop.png
            /tmp/app.log
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: cloudeide-darwin-arm64
          path: ${{ steps.package.outputs.name }}.zip
          retention-days: 14

      - name: Publish a release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.package.outputs.version }}"
          asset="CloudeIDE-darwin-arm64.zip"
          cp "${{ steps.package.outputs.name }}.zip" "$asset"
          gh release create "$tag" \
            --title "CloudeIDE ${{ steps.package.outputs.version }}" \
            --notes "Linux: install the .deb (sudo apt install ./CloudeIDE-linux-x64.deb) so browser sign-in can return to the app; the .tar.gz runs without installing. Windows: unzip and run CloudeIDE.exe. macOS (Apple Silicon): unzip, move CloudeIDE.app to Applications, then right-click it and choose Open the first time. The build is not notarized, so a double-click is refused once. Same thing from a terminal: xattr -dr com.apple.quarantine /Applications/CloudeIDE.app" \
            || echo "release $tag already exists"
          gh release upload "$tag" "$asset" --clobber
