# Publishes the CloudeIDE site: the landing page, and nothing else.
#
# It used to publish a browser build of the editor under /editor/ as well.
# That build is gone — it could not open a folder on the machine in front of
# you, could not run a terminal, and could not receive the sign-in it offered,
# so it was a second, smaller product wearing the same name. One product, one
# download.
#
# Everything happens on a GitHub runner, so nobody needs a machine with the
# sources on it to get a working link.
#
# The landing page lives here rather than beside the rest of the product
# because GitHub Pages does not serve a private repository without a paid
# plan, and this one is public. Only the page is here — it is the same HTML
# anyone can already read from the served site. The server, the database and
# the enterprise code stay where they were.
#
# `enablement: true` turns Pages on for this repository the first time the
# workflow runs, so the site comes up without a visit to the settings page.
name: CloudeIDE site

on:
  workflow_dispatch:
  push:
    branches: [cloudeide-branding]
    paths:
      - '.github/workflows/cloudeide-preview.yml'
      - 'landing/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cloudeide-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # No node, no npm ci, no sysroots, no disk clearing. All of that was
      # here to compile a web bundle; what is left copies HTML.
      - name: Assemble the static site
        run: |
          set -euo pipefail

          # Copying a folder, which is the whole job now. There used to be a
          # twenty-minute web bundle above this — two gulp tasks that
          # repeatedly ran the runner out of heap — and it existed to produce
          # /editor/. Nothing points at /editor/ any more.
          mkdir -p site
          cp -r landing/. site/

          # The /app/ rewrite is gone with the links it fixed: the page no
          # longer points at an application that this domain does not serve.
          # Nothing here should hold an absolute path, so the build says so
          # rather than trusting it.
          if grep -rn 'href="/' site --include='*.html'; then
            echo "::error::an absolute link survived into the published site"
            exit 1
          fi

          # Cache busting, because a stylesheet that does not arrive is
          # indistinguishable from a fix that was never made. The page is
          # revalidated but styles.css and script.js are served with a
          # lifetime, so a layout change can land and still be invisible for
          # as long as the old copy is held — which is exactly what it looks
          # like when someone reloads and sees the same broken thing.
          #
          # The stamp is the file's own hash: it changes when the file does
          # and not otherwise, so a rebuild that changes nothing does not
          # force a re-download.
          for asset in styles.css script.js; do
            [ -f "site/$asset" ] || continue
            stamp="$(sha256sum "site/$asset" | cut -c1-10)"
            find site -maxdepth 1 -name '*.html' -print0 | xargs -0 sed -i \
              -e "s#\(href\|src\)=\"$asset\"#\1=\"$asset?v=$stamp\"#g"
            echo "stamped $asset as $stamp"
          done

          # No CNAME any more, on purpose.
          #
          # This wrote `cloudeide.com` into the artifact, which is how GitHub
          # Pages claims a domain — and while Pages holds it, nothing else can
          # answer for it. cloudeide.com is served by the application now:
          # landing page at /, dashboard at /app, API at /api, one host.
          #
          # Pages stays as a preview of this branch at its project URL, which
          # is what it is useful for. Putting the name back here would take
          # the domain off the application again the next time it deploys.

          touch site/.nojekyll
          du -sh site
          find site -type f | wc -l

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
