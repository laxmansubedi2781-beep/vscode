# Publishes the CloudeIDE site: the landing page at the root, and the browser
# build of the editor under /editor/.
#
# Everything happens on a GitHub runner, so nobody needs a machine with the
# sources on it to get a working link.
#
# The landing page lives here rather than beside the rest of the product
# because GitHub Pages does not serve a private repository without a paid
# plan, and this one is public. Only the page is here — it is the same HTML
# anyone can already read from the served site. The server, the database and
# the enterprise code stay where they were.
#
# `enablement: true` turns Pages on for this repository the first time the
# workflow runs, so the site comes up without a visit to the settings page.
name: CloudeIDE site

on:
  workflow_dispatch:
  push:
    branches: [cloudeide-branding]
    paths:
      - '.github/workflows/cloudeide-preview.yml'
      - 'build/cloudeide/**'
      - 'src/vs/workbench/contrib/cloudeide/**'
      - 'landing/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cloudeide-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The runner ships with toolchains this build never touches, and the
      # build needs the room they occupy.
      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      # The same packages upstream's own PR workflow installs: npm ci builds
      # native modules (kerberos, native-keymap) that need these headers, and
      # without them the install fails before any of the build runs.
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        run: npm ci

      # The full build runs a check that fails on upstream source this fork has
      # not touched, so this takes the path CI itself uses: compile without
      # mangling, then bundle.
      - name: Build the web bundle
        run: |
          npm run gulp compile-build-without-mangling
          npm run gulp vscode-web-min-ci
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Assemble the static site
        run: |
          set -euo pipefail

          # The landing page is the front door, so it takes the root; the
          # editor sits one level down where a link can point at it.
          mkdir -p site
          cp -r landing/. site/
          node build/cloudeide/make-static.mjs ../vscode-web site/editor "$PWD"

          # `/app/...` is right when the application serves the page from its
          # own origin and wrong from a project path, where the root belongs to
          # the account rather than the repository. Rewritten in the published
          # copy only; the source keeps the form the application needs.
          find site -maxdepth 1 -name '*.html' -print0 | xargs -0 sed -i \
            -e 's#href="/app/#href="https://cloudeide.com/app/#g' \
            -e 's#href="/site.webmanifest"#href="site.webmanifest"#g'

          touch site/.nojekyll
          du -sh site
          find site -type f | wc -l

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
