# Publishes the CloudeIDE site: the landing page at the root, and the browser
# build of the editor under /editor/.
#
# Everything happens on a GitHub runner, so nobody needs a machine with the
# sources on it to get a working link.
#
# The landing page lives here rather than beside the rest of the product
# because GitHub Pages does not serve a private repository without a paid
# plan, and this one is public. Only the page is here — it is the same HTML
# anyone can already read from the served site. The server, the database and
# the enterprise code stay where they were.
#
# `enablement: true` turns Pages on for this repository the first time the
# workflow runs, so the site comes up without a visit to the settings page.
name: CloudeIDE site

on:
  workflow_dispatch:
  push:
    branches: [cloudeide-branding]
    paths:
      - '.github/workflows/cloudeide-preview.yml'
      - 'build/cloudeide/**'
      - 'src/vs/workbench/contrib/cloudeide/**'
      - 'landing/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cloudeide-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The runner ships with toolchains this build never touches, and the
      # build needs the room they occupy.
      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      # The same packages upstream's own PR workflow installs: npm ci builds
      # native modules (kerberos, native-keymap) that need these headers, and
      # without them the install fails before any of the build runs.
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        run: npm ci

      # The full build runs a check that fails on upstream source this fork has
      # not touched, so this takes the path CI itself uses: compile without
      # mangling, then bundle.
      - name: Build the web bundle
        run: |
          npm run gulp compile-build-without-mangling
          npm run gulp vscode-web-min-ci
        env:
          # The limit that actually governs this build is the one in
          # package.json's `gulp` script, because a flag on the command line
          # beats NODE_OPTIONS. Setting it here alone did nothing — a run that
          # died at 8043 MB with this set to 12288 is what proved it. It stays
          # for the node processes the build spawns without that flag.
          NODE_OPTIONS: --max-old-space-size=12288

      - name: Assemble the static site
        run: |
          set -euo pipefail

          # The landing page is the front door, so it takes the root; the
          # editor sits one level down where a link can point at it.
          mkdir -p site
          cp -r landing/. site/
          node build/cloudeide/make-static.mjs ../vscode-web site/editor "$PWD"

          # The /app/ rewrite is gone with the links it fixed: the page no
          # longer points at an application that this domain does not serve.
          # Nothing here should hold an absolute path, so the build says so
          # rather than trusting it.
          if grep -rn 'href="/' site --include='*.html'; then
            echo "::error::an absolute link survived into the published site"
            exit 1
          fi

          # Cache busting, because a stylesheet that does not arrive is
          # indistinguishable from a fix that was never made. The page is
          # revalidated but styles.css and script.js are served with a
          # lifetime, so a layout change can land and still be invisible for
          # as long as the old copy is held — which is exactly what it looks
          # like when someone reloads and sees the same broken thing.
          #
          # The stamp is the file's own hash: it changes when the file does
          # and not otherwise, so a rebuild that changes nothing does not
          # force a re-download.
          for asset in styles.css script.js; do
            [ -f "site/$asset" ] || continue
            stamp="$(sha256sum "site/$asset" | cut -c1-10)"
            find site -maxdepth 1 -name '*.html' -print0 | xargs -0 sed -i \
              -e "s#\(href\|src\)=\"$asset\"#\1=\"$asset?v=$stamp\"#g"
            echo "stamped $asset as $stamp"
          done

          # The custom domain. GitHub Pages reads this file out of the
          # published artifact and serves the site from that name, which also
          # moves it off the /cloudevs/ project path: a custom domain is
          # served from its own root.
          echo 'cloudeide.com' > site/CNAME

          touch site/.nojekyll
          du -sh site
          find site -type f | wc -l

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
